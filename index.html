<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131517" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="충칭 여행">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M10 44h44M14 44V26h8v18M26 44V16h10v28M40 44V24h10v20' stroke='%23fff' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<title>충칭 여행 가이드</title>
<style>
/* 글꼴은 기기 기본 글꼴(Google Fonts는 중국에서 막혀 로딩이 멈출 수 있음) */
:root{color-scheme:light dark;
 --bg:#f5f3ef;--card:#fff;--ink:#1d2125;--mute:#6a7079;--line:#e7e3dc;--soft:#efece6;
 --acc:#0f766e;--acc-ink:#fff;--acc-soft:#e3f2ef;--time:#b4580b;--now:#d97706;
 --kr:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
 --zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root{
 --bg:#131517;--card:#1c1f22;--ink:#eceef0;--mute:#9aa1a9;--line:#2b2f34;--soft:#23272b;
 --acc:#5fd3bf;--acc-ink:#0b1513;--acc-soft:#173430;--time:#f0a95a;--now:#fbbf24}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--kr);overflow-x:clip;-webkit-tap-highlight-color:transparent}
.zh{font-family:var(--zh)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit}
a{color:inherit}

/* 상단 */
.top{padding:calc(env(safe-area-inset-top) + 20px) 0 8px}
.top h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.02em}
.top p{margin:4px 0 0;color:var(--mute);font-size:14px}
.sky{display:block;width:100%;height:auto;margin:14px 0 0;color:var(--acc)}

/* 숙소 카드 */
.hotel{margin:14px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px}
.hotel .lab{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.04em}
.hotel .nm{font-size:18px;font-weight:700;margin:2px 0 0}
.hotel .ad{font-size:14px;margin-top:6px;word-break:break-all}

/* 버튼 */
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:13px}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.tabs a:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* 날짜 탭 */
.tabs{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs a{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;min-height:48px;padding:4px 6px;border-radius:12px;text-decoration:none;color:var(--mute);font-size:12px;line-height:1.25}
.tabs a b{font-size:15px;color:var(--ink)}
.tabs a[aria-current=true]{background:var(--ink);color:var(--bg)}
.tabs a[aria-current=true] b{color:var(--bg)}
.tabs a .td{display:inline-block;font-size:10px;font-weight:700;color:var(--now);margin-left:2px}

/* 날짜 */
.day{display:none;padding:18px 0 8px}.day.on{display:block}
.dh h2{font-size:24px;line-height:1.2;margin:0;letter-spacing:-.01em}
.dh p{margin:4px 0 0;color:var(--mute);font-size:15px}

/* 일정 타임라인 */
.tl{position:relative;margin-top:16px}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.stop{position:relative;padding-left:28px;margin-bottom:14px}
.stop::before{content:"";position:absolute;left:1px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--acc)}
.stop.now::before{background:var(--now);border-color:var(--now);box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 25%,transparent)}
.stop.past{opacity:.62}
.sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--time);font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--now);color:#1d1205}
.badge.nx{background:var(--acc-soft);color:var(--acc)}
.sc h3{margin:4px 0 0;font-size:19px;line-height:1.3}
.sc p{margin:8px 0 0}
.how{margin-top:10px;font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px}
.how b{color:var(--acc)}
.tip{font-size:14px;color:var(--mute);margin-top:8px}

/* 근처 펼치기 */
details.near{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
details.near summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:44px;font-weight:700;font-size:15px;color:var(--acc)}
details.near summary::-webkit-details-marker{display:none}
details.near summary::after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .2s}
details.near[open] summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.cat{font-size:12px;font-weight:800;color:var(--mute);margin:12px 0 2px;letter-spacing:.02em}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it .n{font-weight:700;font-size:15px;line-height:1.35}
.it .n .zh{font-weight:500;color:var(--mute);font-size:14px}
.it .d{grid-column:1;font-size:13.5px;color:var(--mute);line-height:1.45}
.it .bs{grid-row:1/span 2;grid-column:2;display:flex;gap:6px}
.btn.dd{border-color:color-mix(in srgb,#f97316 45%,var(--line));color:var(--ink)}

/* 대안 */
.alt h4{margin:22px 0 10px;font-size:16px}
.alt .sc{margin-bottom:12px}

/* 준비 */
.grid{display:grid;gap:12px;margin-top:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.box h3{margin:0 0 6px;font-size:17px}
.box ul{margin:0;padding-left:18px}.box li{margin:6px 0}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}

footer{color:var(--mute);font-size:13px;padding:8px 0 calc(env(safe-area-inset-bottom) + 96px)}

/* 크게 보기 */
#big{position:fixed;inset:0;z-index:20;background:#fff;color:#111;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
#big.on{display:flex}
#big .to{font:800 clamp(40px,12vw,80px)/1.15 var(--zh);word-break:keep-all;overflow-wrap:anywhere}
#big .sub{font-size:20px;color:#555;margin-top:12px}
#big .btn{margin-top:28px;background:#111;color:#fff;border-color:#111}

/* 안내(위쪽: 아이폰 Safari는 아래 주소창이 화면을 덮음) */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);text-align:center;background:#1d2125;color:#fff;padding:10px 16px;border-radius:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#toast.on{opacity:1}#toast.act{pointer-events:auto}
#toast a{display:inline-block;margin-left:10px;padding:4px 10px;border-radius:999px;background:#fff;color:#1d2125;font-weight:700;text-decoration:none}
/* 내 주변 빠른 검색 */
.quick{margin:12px 0 4px}
.quick .lab{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* 환율·체크리스트 */
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.fx label{font-size:12px;color:var(--mute);font-weight:700}
.fx input{width:100%;font:600 20px var(--kr);padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fx .eq{font-size:20px;color:var(--mute);padding-top:18px}
.rate{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mute)}
.rate input{width:88px;font:600 14px var(--kr);padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chk{list-style:none;padding:0!important}
.chk li{margin:0!important}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.chk li:last-child label{border-bottom:0}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--acc);flex:none}
.chk input:checked+span{color:var(--mute);text-decoration:line-through}
/* 맛집 모아보기 */
.fh{margin:14px 0 6px;font-size:15px}
.fh small{color:var(--mute);font-weight:500}
.flist{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2px 14px}

/* 넓은 화면(아이폰 듀오 펼친 화면·아이패드) */
@media (min-width:640px){
 .wrap{padding:0 24px}
 .near .items,.flist .items{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
 .alt .altg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.alt .altg .sc{margin:0}
 .grid{grid-template-columns:1fr 1fr}
 .top h1{font-size:32px}
}
@media (min-width:980px){
 .layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:8px;max-width:1240px;margin:0 auto}
 .layout>.top{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
 .layout>.top .wrap{padding-right:0}
 .layout>.top .chips{flex-wrap:wrap;overflow:visible}
 .content .wrap{max-width:none}
}
/* 아주 좁은 화면(듀오 바깥 화면 등) */
@media (max-width:360px){
 body{font-size:15px}.wrap{padding:0 12px}
 .btn{padding:8px 11px;font-size:14px}
 .sc{padding:12px}.stop{padding-left:24px}
 .tabs a{min-width:56px;padding:4px 8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes ride{from{transform:translateX(-120px)}to{transform:translateX(980px)}}
.train{animation:ride 10s linear infinite}
</style>
</head>
<body>
<div class="layout">
<header class="top"><div class="wrap">
 <h1>충칭 3박 4일</h1>
 <p>11월 27일(금) – 30일(월) · 일정, 지도, 근처 맛집·카페·할 거리</p>
 <svg class="sky" viewBox="0 0 900 150" role="img" aria-label="산비탈 빌딩 사이를 지나는 모노레일과 강 위 케이블카">
  <rect width="900" height="150" rx="18" fill="currentColor" opacity=".08"/>
  <g fill="currentColor" opacity=".28">
   <rect x="40" y="46" width="46" height="74"/><rect x="96" y="26" width="38" height="94"/><rect x="146" y="60" width="60" height="60"/>
   <rect x="250" y="20" width="70" height="100"/><rect x="330" y="44" width="44" height="76"/><rect x="400" y="54" width="120" height="66"/>
   <rect x="560" y="34" width="54" height="86"/><rect x="624" y="10" width="34" height="110"/><rect x="668" y="50" width="62" height="70"/><rect x="760" y="60" width="48" height="60"/><rect x="818" y="40" width="50" height="80"/>
  </g>
  <line x1="0" y1="96" x2="900" y2="96" stroke="currentColor" stroke-width="4" opacity=".5"/>
  <g class="train"><rect x="0" y="80" width="110" height="14" rx="6" fill="currentColor"/></g>
  <rect y="120" width="900" height="30" fill="currentColor" opacity=".18"/>
  <line x1="600" y1="14" x2="900" y2="86" stroke="currentColor" stroke-width="2" opacity=".6"/>
  <g transform="translate(760 52)"><line x1="0" y1="0" x2="0" y2="12" stroke="currentColor" stroke-width="2" opacity=".6"/><rect x="-16" y="12" width="32" height="18" rx="4" fill="currentColor"/></g>
 </svg>
 <section class="hotel" aria-label="숙소">
  <div class="lab">숙소</div>
  <div class="nm">Nuanyu Apartment · 둥허완 C동</div>
  <div class="ad">위중구 차오첸루 26호 둥허완 C동 · 해방비·홍야동 걸어서 10–15분</div>
  <div class="row">
   <a class="btn p" id="hotelAmap" data-name="重庆市渝中区朝千路26号东和湾C栋">Amap</a>
   <button class="btn dd" data-didi="暖余·江景民宿(重庆解放碑洪崖洞店)">🚖 숙소로 DiDi</button>
   <button class="btn" data-copy="重庆市渝中区朝千路26号东和湾C栋">주소 복사</button>
   <button class="btn" data-big="重庆市渝中区朝千路26号东和湾C栋" data-sub="이 주소로 가 주세요">기사님께 보여주기</button>
  </div>
 </section>
 <div class="quick"><div class="lab">내 주변 빠른 검색 (Amap)</div><div class="chips" id="quick"></div></div>
</div></header>
<div class="content">

<nav class="tabs" aria-label="날짜"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="days"></main>
<footer class="wrap">이동 시간·요금·영업시간은 대략적인 값이에요. 출발 전에 Amap에서 한 번 더 확인하세요. 🚖 DiDi를 누르면 목적지 이름이 복사되고 DiDi가 열려요. 목적지 칸에 붙여넣으세요.</footer>
</div></div>

<div id="big" role="dialog" aria-modal="true" aria-label="크게 보기">
 <div class="to" id="bigTo"></div><div class="sub" id="bigSub"></div>
 <button class="btn" id="bigClose">닫기</button>
</div>
<div id="toast" role="status"></div>

<script>
{
const enc=encodeURIComponent;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H2='重庆市渝中区朝千路26号东和湾C栋';
const IOS0=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const AND=/Android/.test(navigator.userAgent),IOS=IOS0&&!AND;
// Amap 장소 검색(공식 URI 문서): iOS iosamap://poi, Android androidamap://poi, 그 밖은 웹 uri.amap.com
const amap=q=>({
 app:IOS?`iosamap://poi?sourceApplication=cqtrip&name=${enc(q)}&dev=0`
  :AND?`androidamap://poi?sourceApplication=cqtrip&keywords=${enc(q)}&dev=0`:'',
 web:`https://uri.amap.com/search?keyword=${enc(q)}&city=${enc('重庆')}&callnative=1`});
const L=o=>o.app?`href="${esc(o.app)}" data-app="1" data-web="${esc(o.web)}"`:`href="${esc(o.web)}" target="_blank" rel="noopener"`;
// DiDi 목적지 칸에 붙여넣을 이름: 검색 결과에서 하나로 좁혀지는 POI 이름(넓은 지명만 바꿈)
const DIDI={'解放碑':'人民解放纪念碑','洪崖洞':'洪崖洞民俗风貌区','山城巷':'山城巷传统风貌区','小什字':'小什字地铁站','弹子石老街':'长嘉汇弹子石老街','重庆小面':'酱老麻抄手重庆小面馆(解放碑总店)'};
const dn=q=>DIDI[q]||q;
const DD=(q,sm)=>`<button class="btn dd${sm?' sm':''}" data-didi="${esc(dn(q))}">🚖 DiDi</button>`;
const setL=(el,o)=>{if(o.app){el.href=o.app;el.dataset.app='1';el.dataset.web=o.web}else{el.href=o.web;el.target='_blank';el.rel='noopener'}};

/* ── 근처 맛집·카페·할 거리 ── 조사 결과(출처는 저장소 README가 아닌 각 항목 src에 보관) */
const NEAR={"解放碑":[{"cat":"food","ko":"산청 라오탕커우 (구글맵 저장)","zh":"山城老堂口 解放碑八一路","note":"라쯔지 + 돼지족탕 · 옛 충칭 요리","walk":"해방비에서 도보 3분"},
 {"cat":"do","ko":"해방비 (인민해방기념비)","zh":"人民解放纪念碑","note":"충칭 도심의 상징 · 보행가 산책과 야경","walk":""},
 {"cat":"snack","ko":"바이 먹자골목","zh":"八一好吃街","note":"튀김 고기·장미 찹쌀떡 빙펀 등 길거리 간식 · 1인 10–20위안","walk":"해방비에서 도보 3분"},
 {"cat":"food","ko":"하오유라이 쏸라펀","zh":"好又来酸辣粉(好吃街店)","note":"새콤매콤 당면 명물 · 약 11위안 · 줄 서는 곳","walk":"도보 3분"},
 {"cat":"food","ko":"화스 완짜몐","zh":"花市豌杂面(民生路店)","note":"완두·고기볶음 비빔면 · 약 17위안 · 07–20시","walk":"도보 8분"},
 {"cat":"food","ko":"저우스슝 따다오야오펜 훠궈","zh":"周师兄大刀腰片火锅(解放碑总店)","note":"큼직하게 썬 돼지콩팥(다다오야오폔)이 간판 · 1인 약 78위안","walk":"도보 8분"},

 return {d:`${p.year}-${p.month}-${p.day}`,m:+p.hour*60+ +p.minute}};
const today=()=>{const n=cn();return DAYS.find(d=>d.date===n.d)};
const mark=()=>{const n=cn(),td=today();
 tabs.querySelectorAll('.td').forEach(x=>x.hidden=true);
 document.querySelectorAll('.stop').forEach(s=>{s.classList.remove('now','past');const b=s.querySelector('.badge');b.hidden=true;b.classList.remove('nx')});
 if(!td)return;
 tabs.querySelector(`a[data-id="${td.id}"] .td`).hidden=false;
 const st=[...document.querySelectorAll(`#p-${td.id} .stop`)],mins=st.map(s=>{const[h,m]=s.dataset.t.split(':');return +h*60+ +m});
 let cur=-1;mins.forEach((v,i)=>{if(v<=n.m)cur=i});
 st.forEach((s,i)=>{const b=s.querySelector('.badge');
  if(i<cur)s.classList.add('past');
  if(i===cur){s.classList.add('now');b.textContent='지금';b.hidden=false}
  if(i===cur+1){b.textContent='다음';b.classList.add('nx');b.hidden=false}})};

const show=()=>{const td=today();const id=(location.hash||'#'+(td?td.id:'day1')).slice(1);const ok=document.getElementById('p-'+id)?id:'day1';
 document.querySelectorAll('.day').forEach(x=>x.classList.toggle('on',x.id==='p-'+ok));
 tabs.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',a.dataset.id===ok))};
// 날짜 탭을 바꾸면 그날 일정 맨 위로
window.addEventListener('hashchange',()=>{show();const t=days.getBoundingClientRect().top+scrollY-70;if(scrollY>t)scrollTo({top:t})});
show();mark();setInterval(mark,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)mark()});

/* ── 복사·안내·앱 열기 ── */
const toast=document.getElementById('toast');let tt;
const say=(m,link)=>{toast.textContent=m;if(link){const a=document.createElement('a');a.href=link;a.textContent='웹 지도로 열기';toast.append(a)}
 toast.classList.toggle('act',!!link);toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on','act'),link?20000:2600)};
const cp=(v,m)=>{const ok=()=>say(m||'복사했어요');
 (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(ok).catch(()=>{const t=document.createElement('textarea');t.value=v;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(_){say(v)}t.remove()})};
// 아이폰 Safari는 「○○에서 열겠습니까?」 창이 떠 있는 동안에도 페이지가 보이는 상태라 자동으로 웹으로 넘기지 않고, 2초 뒤 「웹 지도로 열기」 버튼만 보여 줌
const openApp=(app,web,fail)=>{let gone=false;const hid=()=>{if(document.hidden)gone=true},ph=()=>{gone=true};
 document.addEventListener('visibilitychange',hid);window.addEventListener('pagehide',ph);
 location.href=app;
 setTimeout(()=>{document.removeEventListener('visibilitychange',hid);window.removeEventListener('pagehide',ph);
  if(!gone&&!document.hidden)web?say('앱이 안 열렸다면',web):say(fail||'앱이 열리지 않았어요')},2000)};
const big=document.getElementById('big');
document.addEventListener('click',e=>{
 const ap=e.target.closest('a[data-app]');
 if(ap){e.preventDefault();openApp(ap.getAttribute('href'),ap.dataset.web);const n=ap.dataset.name;if(n&&navigator.clipboard)navigator.clipboard.writeText(n).then(()=>say('이름 복사됨 · Amap 여는 중…')).catch(()=>{});return}
 const dd=e.target.closest('[data-didi]');
 if(dd){const v=dd.dataset.didi;
  // diditaxi:// 는 DiDi 공식 문서에 없는 scheme(커뮤니티 목록 기준, 이전 버전에서 아이폰으로 열리는 것 확인). 목적지 파라미터는 없어 이름을 복사해 두고 앱만 엶
  if(IOS0||AND){cp(v,'목적지 이름 복사됨 · DiDi 목적지 칸에 붙여넣기');openApp('diditaxi://','','DiDi가 안 열렸어요 · 앱을 직접 열고 목적지 칸에 붙여넣기 (이름은 복사돼 있어요)')}
  else cp(v,'목적지 이름 복사됨 · DiDi는 휴대폰에서 열려요');return}
 const c=e.target.closest('[data-copy]');
 if(c){cp(c.dataset.copy,c.dataset.msg?'복사했어요 · '+c.dataset.msg:null);return}
 const b=e.target.closest('[data-big]');
 if(b){document.getElementById('bigTo').textContent=b.dataset.big;document.getElementById('bigSub').textContent=b.dataset.sub||'';big.classList.add('on')}
});
document.getElementById('bigClose').addEventListener('click',()=>big.classList.remove('on'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')big.classList.remove('on')});
}
</script>
</body>
</html>
